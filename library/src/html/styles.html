<style>
  /* Shared palette for every firm; only the logo and name change. */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1d2433;
    --muted: #5b6475;
    --accent: #1f4e8c;
    --accent-text: #ffffff;
    --border: #d9dde5;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1b2029;
      --text: #e8ebf1;
      --muted: #a3abba;
      --accent: #6d9ee6;
      --accent-text: #0d1117;
      --border: #2c3340;
    }
  }
  * { box-sizing: border-box; }
  /* display rules below (input, select…) must never beat the hidden attribute */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  h1 { margin: 0; font-size: 1.4rem; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .brand img { max-height: 56px; max-width: 160px; object-fit: contain; border-radius: 6px; }
  .foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }
  .foot p { margin: 0 0 8px; }
  details { margin: 0 0 12px; }
  summary { cursor: pointer; color: var(--accent); min-height: 32px; display: list-item; }
  details p { margin: 8px 0; color: var(--muted); }
  a { color: var(--accent); }
  @media (max-width: 420px) {
    body { padding: 12px 8px; }
    .card { padding: 16px; border-radius: 10px; }
    .brand { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  button {
    min-height: 44px;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font: inherit;
    cursor: pointer;
  }
  button.link { min-height: 32px; padding: 4px 0; background: none; color: var(--accent); text-decoration: underline; }
  label, .label { display: block; margin: 16px 0 6px; font-weight: 600; }
  input, select, textarea {
    display: block; width: 100%; min-height: 44px; padding: 10px 12px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit;
  }
  input:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #code { font-size: 1.6rem; letter-spacing: .4em; text-align: center; }
  button:disabled { opacity: .6; cursor: default; }
  .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .links { margin-top: 16px; line-height: 2; }
  .muted { color: var(--muted); }
  textarea { resize: vertical; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .case-only { margin: 0 0 8px; font-weight: 600; }
  .small { font-size: .875rem; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  .button {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin: 0;
    padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  .button.secondary { background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
  input:focus-visible + .button { outline: 3px solid var(--accent); outline-offset: 2px; }
  .drop { padding: 16px; border: 2px dashed var(--border); border-radius: 10px; text-align: center; }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .drop-hint { display: block; margin-top: 8px; }
  @media (pointer: coarse) { .drop-hint { display: none; } }
  .drop p { margin: 8px 0 0; }
  .queue { list-style: none; padding: 0; margin: 12px 0; }
  .item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .item .name { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .item .meta { display: block; font-size: .875rem; color: var(--muted); }
  .item.done .meta { color: #1e7b34; }
  .item.failed .meta, .item.invalid .meta { color: #b3261e; }
  .item progress { width: 100%; height: 6px; margin-top: 6px; accent-color: var(--accent); }
  .item .link { margin-right: 12px; font-size: .875rem; }
  #sendFiles { width: 100%; margin-top: 8px; }
  .checklist { margin: 8px 0 24px; }
  .checklist progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .progress-line { margin: 4px 0; font-weight: 600; }
  .group { margin-top: 20px; }
  .group h2 { font-size: 1.1rem; margin: 0; }
  .group > p { margin: 2px 0 8px; }
  .citems { list-style: none; padding: 0; margin: 0; }
  .citem { padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 10px; }
  .citem.received, .citem.accepted { opacity: .85; }
  .citem p { margin: 6px 0 0; }
  .chead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
  .badge { font-size: .8rem; padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--text); }
  .badge.accepted { background: #e7f4ea; color: #1e7b34; }
  .badge.received { background: #e8eef7; color: #1f4e8c; }
  .badge.rejected { background: #fbe9e7; color: #b3261e; }
  .tag { font-size: .8rem; color: var(--muted); }
  .reason { color: #b3261e; font-weight: 600; }
  .secondary-btn { margin-top: 10px; background: var(--surface); color: var(--accent); border: 2px solid var(--accent); }
  .citem .link { margin-top: 8px; font-size: .9rem; }
  .finish { margin-top: 16px; }
  .finish button { width: 100%; }
  @media (prefers-color-scheme: dark) {
    .badge.accepted { background: #1f3a26; color: #7fd38f; }
    .badge.received { background: #1d2a3f; color: #9ec1f2; }
    .badge.rejected { background: #3a1f1f; color: #ff8a80; }
    .reason { color: #ff8a80; }
  }
  .ok { padding: 12px; border-radius: 8px; background: #e7f4ea; color: #1d2433; }
  @media (prefers-color-scheme: dark) {
    .item.done .meta { color: #7fd38f; }
    .item.failed .meta, .item.invalid .meta { color: #ff8a80; }
    .ok { background: #1f3a26; color: #e8ebf1; }
  }
  #status { color: var(--muted); min-height: 1.5em; }
  #status.bad { color: #b3261e; }
  @media (prefers-color-scheme: dark) { #status.bad { color: #ff8a80; } }
</style>
