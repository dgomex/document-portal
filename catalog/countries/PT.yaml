# Portugal: national (long-stay) residence visas, and the residence permits
# (autorizações de residência) asked for at AIMA in Portugal.
# Sources: the Portuguese consular checklists (vistos.mne.gov.pt, as published
# by the posts' visa centres). Lists vary slightly between consular posts, so
# firms adjust them; the lawyer owns the final list.
country:
  code: PT
  name: { pt: "Portugal", en: "Portugal", es: "Portugal" }

# requirement fields:
#   doc: a document type, or any_of: [doc, doc, …] (either/or group with an id)
#   applies_to: main_applicant | spouse | each_child | each_adult | each_person | case
#   level: required (default) | optional
#   only_if / unless: [fact ids]
#   min_age: for each_adult (default 16)
sets:
  PT-GENERAL:
    - { doc: APPLICATION_FORM, applies_to: each_person }
    - { doc: PHOTOS, applies_to: each_person }
    - { doc: PASSPORT, applies_to: each_person }
    - { doc: LEGAL_RESIDENCE_ELSEWHERE, applies_to: each_person, only_if: [other_residence] }
    - { doc: TRAVEL_INSURANCE, applies_to: each_person, unless: [cplp] }
    - { doc: CRIMINAL_RECORD, applies_to: each_adult, min_age: 16 }
    - { id: ACCOMMODATION, any_of: [PROPERTY_DEED, RENTAL_AGREEMENT, HOST_TERM], applies_to: case,
        name: { pt: "Alojamento em Portugal (1 ano)", en: "Accommodation in Portugal (1 year)", es: "Alojamiento en Portugal (1 año)" } }
    - { id: MEANS, any_of: [BANK_STATEMENTS, SPONSOR_TERM], applies_to: case,
        name: { pt: "Meios de subsistência (12 meses)", en: "Means of subsistence (12 months)", es: "Medios de subsistencia (12 meses)" } }
  PT-FAMILY:
    - { doc: RELATIONSHIP_PROOF, applies_to: case, only_if: [married] }
    - { doc: BIRTH_CERTIFICATE, applies_to: each_child }
    - { doc: PARENTS_IDS, applies_to: case, only_if: [children] }
    - { doc: PARENTAL_CONSENT, applies_to: each_child, level: optional }
    - { doc: SOLE_CUSTODY_PROOF, applies_to: case, only_if: [children, sole_custody] }

  # Residence permits (autorizações de residência) are asked for in Portugal,
  # at AIMA, by each person on their own: family members go through family
  # reunification, so these lists cover the main applicant.
  PT-AIMA-BASE:
    - { doc: AIMA_FORM, applies_to: main_applicant }
    - { doc: PASSPORT_VALID, applies_to: main_applicant }
    - { doc: ADDRESS_DECLARATION, applies_to: main_applicant }
    - { id: AIMA_HOUSING, any_of: [LAND_REGISTRY_CERT, LANDLORD_DECLARATION], applies_to: main_applicant,
        name: { pt: "Título de habitação", en: "Right to live at the address", es: "Título de vivienda" } }
  PT-AIMA-TAX:
    - { doc: NIF_PROOF, applies_to: main_applicant }
    - { doc: NISS_PROOF, applies_to: main_applicant }

  PT-ARI-GENERAL:
    - { doc: ARI_FORM, applies_to: main_applicant }
    - { doc: PASSPORT_VALID, applies_to: main_applicant }
    - { doc: HEALTH_INSURANCE, applies_to: main_applicant }
    - { doc: CRIMINAL_RECORD, applies_to: main_applicant }
    - { doc: FOREIGN_TAX_ID, applies_to: main_applicant }
    - { doc: INVESTMENT_COMMITMENT, applies_to: main_applicant }
    - { doc: NO_DEBT_DECLARATIONS, applies_to: main_applicant }
    - { doc: ARI_FEE_RECEIPT, applies_to: main_applicant }
  # Family reunification: the resident in Portugal applies; the spouse and
  # children being reunited are added in People and get their own documents.
  PT-REUNIFICATION:
    - { doc: AIMA_FORM, applies_to: main_applicant }
    - { doc: SPONSOR_PERMIT, applies_to: main_applicant }
    - { doc: ADDRESS_DECLARATION, applies_to: main_applicant }
    - { id: AIMA_HOUSING, any_of: [LAND_REGISTRY_CERT, LANDLORD_DECLARATION], applies_to: main_applicant,
        name: { pt: "Título de habitação", en: "Right to live at the address", es: "Título de vivienda" } }
    - { doc: SUBSISTENCE_PROOF, applies_to: main_applicant }
    - { doc: RELATIONSHIP_PROOF, applies_to: spouse }
    - { doc: CRIMINAL_RECORD, applies_to: spouse }
    - { doc: BIRTH_CERTIFICATE, applies_to: each_child }
    - { doc: NON_RESIDENT_PARENT_CONSENT, applies_to: each_child, level: optional }
    - { id: OTHER_FAMILY_LINK, any_of: [ADOPTION_DECISION, GUARDIANSHIP_DECISION, INCAPACITY_REPORT, DEPENDENCY_PROOF], applies_to: case, level: optional,
        name: { pt: "Outros vínculos (adoção, tutela, incapacidade, dependência)", en: "Other family links (adoption, guardianship, incapacity, dependency)", es: "Otros vínculos (adopción, tutela, incapacidad, dependencia)" } }

sources:
  - https://vistos.mne.gov.pt/pt/vistos-nacionais/documentacao-instrutoria/residencia
  - https://aima.gov.pt/pt/trabalhar
  - https://aima.gov.pt/pt/viver
  - https://aima.gov.pt/pt/estudar
  - https://aima.gov.pt/pt/empreender
  - https://vistos.mne.gov.pt/en/national-visas/national-legislation

