# Reusable document types. `name` is what the client sees; `instructions` say
# exactly what to send. `rules` add standard notes (validity, apostille…).
# rules: max_age_days (issued within), apostille (true), translation (true =
# certified translation if not in Portuguese, English or Spanish), valid_months
# (beyond the stay).

- id: APPLICATION_FORM
  name: { pt: "Formulário de pedido de visto nacional", en: "National visa application form", es: "Formulario de solicitud de visado nacional" }
  instructions:
    pt: "Preenchido na íntegra e assinado (assinatura igual à do passaporte). Para menores, assinado pelo representante legal."
    en: "Fully completed and signed (signature as in the passport). For minors, signed by the legal guardian."
    es: "Completo y firmado (firma igual a la del pasaporte). Para menores, firmado por el representante legal."

- id: PHOTOS
  name: { pt: "Fotografias tipo passe (2)", en: "Passport photos (2)", es: "Fotografías tipo carné (2)" }
  instructions:
    pt: "Duas fotografias iguais, recentes, a cores, com fundo claro."
    en: "Two identical, recent colour photos on a light background."
    es: "Dos fotografías iguales, recientes, en color, con fondo claro."

- id: PASSPORT
  name: { pt: "Passaporte", en: "Passport", es: "Pasaporte" }
  instructions:
    pt: "Cópia da página de identificação."
    en: "Copy of the identification page."
    es: "Copia de la página de identificación."
  rules: { valid_months: 3 }

- id: LEGAL_RESIDENCE_ELSEWHERE
  name: { pt: "Comprovativo de residência legal no país onde vive", en: "Proof of legal residence in the country where you live", es: "Prueba de residencia legal en el país donde vive" }
  instructions:
    pt: "Autorização de residência do país onde vive, válida para além do fim do visto pedido."
    en: "Residence permit of the country where you live, valid beyond the end of the requested visa."
    es: "Permiso de residencia del país donde vive, válido más allá del fin del visado solicitado."

- id: TRAVEL_INSURANCE
  name: { pt: "Seguro de viagem / saúde", en: "Travel / health insurance", es: "Seguro de viaje / salud" }
  instructions:
    pt: "Válido durante o visto, cobrindo despesas médicas, assistência urgente e repatriamento. Brasileiros podem usar o certificado PB4."
    en: "Valid for the visa period, covering medical costs, urgent care and repatriation. Brazilians may use the PB4 certificate."
    es: "Válido durante el visado, cubriendo gastos médicos, asistencia urgente y repatriación. Los brasileños pueden usar el certificado PB4."

- id: CRIMINAL_RECORD
  name: { pt: "Registo criminal", en: "Criminal record certificate", es: "Certificado de antecedentes penales" }
  instructions:
    pt: "Do país da nacionalidade e de qualquer país onde tenha vivido mais de um ano."
    en: "From your country of nationality and any country where you lived for over a year."
    es: "Del país de su nacionalidad y de cualquier país donde haya vivido más de un año."
  rules: { max_age_days: 90, apostille: true, translation: true }

- id: PROPERTY_DEED
  name: { pt: "Escritura de imóvel em Portugal", en: "Deed of a property in Portugal", es: "Escritura de un inmueble en Portugal" }
  instructions:
    pt: "Em nome do requerente."
    en: "In the applicant's name."
    es: "A nombre del solicitante."

- id: RENTAL_AGREEMENT
  name: { pt: "Contrato de arrendamento em Portugal", en: "Rental agreement in Portugal", es: "Contrato de alquiler en Portugal" }
  instructions:
    pt: "Mínimo de 1 ano, com comprovativo de registo nas Finanças (AT)."
    en: "At least 1 year, with proof of registration with the tax authority (AT)."
    es: "Mínimo 1 año, con justificante de registro en la autoridad tributaria (AT)."

- id: HOST_TERM
  name: { pt: "Termo de responsabilidade de alojamento", en: "Accommodation term of responsibility", es: "Término de responsabilidad de alojamiento" }
  instructions:
    pt: "Assinado pelo anfitrião com assinatura reconhecida por notário, com cópia do documento de identificação e do título do imóvel do anfitrião."
    en: "Signed by the host with a notarised signature, with a copy of the host's ID and of the property deed or lease."
    es: "Firmado por el anfitrión con firma reconocida ante notario, con copia de su documento de identidad y del título del inmueble."

- id: BANK_STATEMENTS
  name: { pt: "Extratos bancários (últimos 3 meses)", en: "Bank statements (last 3 months)", es: "Extractos bancarios (últimos 3 meses)" }
  instructions:
    pt: "Com saldo disponível de pelo menos o salário mínimo português por cada mês de estadia (até 12 meses)."
    en: "Showing an available balance of at least the Portuguese minimum wage for each month of stay (up to 12 months)."
    es: "Con saldo disponible de al menos el salario mínimo portugués por cada mes de estancia (hasta 12 meses)."

- id: SPONSOR_TERM
  name: { pt: "Termo de responsabilidade de meios de subsistência", en: "Financial sponsorship term of responsibility", es: "Término de responsabilidad de medios de subsistencia" }
  instructions:
    pt: "Assinado pelo responsável com assinatura reconhecida por notário, com o seu documento de identificação, extratos bancários de 3 meses e última declaração de IRS."
    en: "Signed by the sponsor with a notarised signature, with their ID, 3 months of bank statements and latest tax return."
    es: "Firmado por el responsable con firma reconocida ante notario, con su documento de identidad, extractos de 3 meses y última declaración de la renta."

- id: PT_BANK_ACCOUNT
  name: { pt: "Conta bancária portuguesa", en: "Portuguese bank account", es: "Cuenta bancaria portuguesa" }
  instructions:
    pt: "Comprovativo de titularidade de uma conta num banco português."
    en: "Proof of an account at a Portuguese bank."
    es: "Justificante de una cuenta en un banco portugués."

- id: EMPLOYMENT_CONTRACT
  name: { pt: "Contrato de trabalho ou promessa", en: "Employment contract or promise of contract", es: "Contrato de trabajo o promesa" }
  instructions:
    pt: "Com identificação das partes, funções, remuneração acima do salário mínimo, local, horário e data de início; assinaturas reconhecidas."
    en: "Identifying both parties, the role, pay above the minimum wage, place, hours and start date; signatures certified."
    es: "Con identificación de las partes, funciones, salario superior al mínimo, lugar, horario y fecha de inicio; firmas legitimadas."

- id: PROFESSIONAL_CERTIFICATE
  name: { pt: "Certificado profissional / diplomas", en: "Professional certificate / diplomas", es: "Certificado profesional / títulos" }
  instructions:
    pt: "Quando a profissão é regulada em Portugal."
    en: "When the profession is regulated in Portugal."
    es: "Cuando la profesión está regulada en Portugal."
  rules: { apostille: true }

- id: CV
  name: { pt: "Curriculum vitae", en: "Curriculum vitae (CV)", es: "Currículum vitae" }

- id: COMPANY_REGISTRATION
  name: { pt: "Registo da empresa / atividade em Portugal", en: "Company or activity registration in Portugal", es: "Registro de la empresa o actividad en Portugal" }
  instructions:
    pt: "Certidão permanente do registo comercial, início de atividade, pacto social e RCBE, quando aplicável."
    en: "Permanent commercial registry certificate, self-employment registration, articles of association and RCBE, as applicable."
    es: "Certificado permanente del registro mercantil, alta de actividad, estatutos y RCBE, según corresponda."

- id: SERVICE_CONTRACT
  name: { pt: "Contrato ou proposta de prestação de serviços", en: "Service contract or proposal", es: "Contrato o propuesta de prestación de servicios" }

- id: BUSINESS_PLAN
  name: { pt: "Declaração de investimento / plano de negócios", en: "Investment declaration / business plan", es: "Declaración de inversión / plan de negocio" }
  instructions:
    pt: "Natureza, valor, duração e meios do investimento realizado ou pretendido em Portugal."
    en: "Nature, amount, duration and means of the investment made or intended in Portugal."
    es: "Naturaleza, importe, duración y medios de la inversión realizada o prevista en Portugal."

- id: INVESTMENT_PROOF
  name: { pt: "Comprovativo de investimento realizado", en: "Proof of investment made", es: "Prueba de la inversión realizada" }

- id: FUNDS_IN_PORTUGAL
  name: { pt: "Comprovativo de meios financeiros em Portugal", en: "Proof of funds available in Portugal", es: "Prueba de fondos disponibles en Portugal" }

- id: IAPMEI_DECLARATION
  name: { pt: "Declaração do IAPMEI (contrato de incubação)", en: "IAPMEI declaration (incubation contract)", es: "Declaración del IAPMEI (contrato de incubación)" }

- id: INVITATION_LETTER
  name: { pt: "Carta convite (ensino, investigação ou cultura)", en: "Invitation letter (teaching, research or culture)", es: "Carta de invitación (docencia, investigación o cultura)" }

- id: ADMISSION_PROOF
  name: { pt: "Comprovativo de admissão em instituição de ensino", en: "Proof of admission to an education institution", es: "Prueba de admisión en un centro de enseñanza" }

- id: SCHOLARSHIP_PROOF
  name: { pt: "Comprovativo de bolsa", en: "Proof of scholarship or grant", es: "Prueba de beca" }

- id: RESEARCH_HOSTING
  name: { pt: "Acordo de acolhimento do centro de investigação", en: "Hosting agreement with the research centre", es: "Acuerdo de acogida del centro de investigación" }

- id: PENSION_PROOF
  name: { pt: "Comprovativo do valor da reforma", en: "Proof of pension amount", es: "Prueba del importe de la pensión" }
  instructions:
    pt: "Carta ou extratos da pensão, ou declaração de impostos, mostrando valor acima do salário mínimo português."
    en: "Pension letter or statements, or tax return, showing an amount above the Portuguese minimum wage."
    es: "Carta o extractos de la pensión, o declaración de impuestos, con un importe superior al salario mínimo portugués."

- id: PASSIVE_INCOME_PROOF
  name: { pt: "Comprovativo de rendimentos passivos", en: "Proof of passive income", es: "Prueba de ingresos pasivos" }
  instructions:
    pt: "Rendas, dividendos, investimentos ou propriedade intelectual, com pelo menos 3 meses de histórico e valor acima do salário mínimo português."
    en: "Rents, dividends, investments or intellectual property, with at least 3 months of history and an amount above the Portuguese minimum wage."
    es: "Alquileres, dividendos, inversiones o propiedad intelectual, con al menos 3 meses de historial e importe superior al salario mínimo portugués."

- id: RELIGIOUS_STATUS
  name: { pt: "Comprovativo de ministro do culto / vida consagrada", en: "Proof of status as minister of religion", es: "Prueba de condición de ministro de culto" }
  instructions:
    pt: "Emitido pela igreja ou comunidade religiosa reconhecida em Portugal, com termo de responsabilidade."
    en: "Issued by the church or religious community recognised in Portugal, with a term of responsibility."
    es: "Emitido por la iglesia o comunidad religiosa reconocida en Portugal, con término de responsabilidad."

- id: EMPLOYER_DECLARATION
  name: { pt: "Declaração do empregador", en: "Employer's declaration", es: "Declaración del empleador" }
  instructions:
    pt: "Confirma o vínculo laboral e que o trabalho pode ser feito à distância."
    en: "Confirms the employment and that the work can be done remotely."
    es: "Confirma la relación laboral y que el trabajo puede realizarse a distancia."

- id: REMOTE_WORK_PROOF
  name: { pt: "Comprovativo de trabalho remoto", en: "Proof the work is done remotely", es: "Prueba de trabajo a distancia" }

- id: INCOME_3_MONTHS
  name: { pt: "Rendimentos dos últimos 3 meses", en: "Income for the last 3 months", es: "Ingresos de los últimos 3 meses" }
  instructions:
    pt: "Recibos de vencimento ou faturas, com média mensal de pelo menos 4 salários mínimos portugueses."
    en: "Payslips or invoices, averaging at least 4 times the Portuguese minimum wage per month."
    es: "Nóminas o facturas, con una media mensual de al menos 4 salarios mínimos portugueses."

- id: TAX_RESIDENCE_ABROAD
  name: { pt: "Certificado de residência fiscal fora de Portugal", en: "Tax residence certificate outside Portugal", es: "Certificado de residencia fiscal fuera de Portugal" }

- id: AIMA_REUNIFICATION
  name: { pt: "Notificação de autorização de reagrupamento familiar (AIMA)", en: "Family reunification authorisation notice (AIMA)", es: "Notificación de autorización de reagrupación familiar (AIMA)" }

- id: FAMILY_MEMBER_ID
  name: { pt: "Documento de identificação do familiar residente", en: "ID of the family member living in Portugal", es: "Documento de identidad del familiar residente" }

- id: MAIN_APPLICANT_VISA_REQUEST
  name: { pt: "Comprovativo do pedido de visto do requerente principal", en: "Proof of the main applicant's visa request", es: "Prueba de la solicitud de visado del solicitante principal" }

- id: RELATIONSHIP_PROOF
  name: { pt: "Certidão de casamento ou união de facto", en: "Marriage or civil partnership certificate", es: "Certificado de matrimonio o pareja de hecho" }
  instructions:
    pt: "Original ou cópia certificada. União de facto não registada: provas de vida em comum há mais de 2 anos."
    en: "Original or certified copy. Unregistered partnership: evidence of living together for over 2 years."
    es: "Original o copia certificada. Pareja no registrada: pruebas de convivencia de más de 2 años."
  rules: { apostille: true, translation: true }

- id: BIRTH_CERTIFICATE
  name: { pt: "Certidão de nascimento (completa)", en: "Full birth certificate", es: "Certificado de nacimiento (literal)" }
  instructions:
    pt: "Com o nome de ambos os pais."
    en: "Showing both parents' names."
    es: "Con el nombre de ambos padres."
  rules: { apostille: true, translation: true }

- id: PARENTS_IDS
  name: { pt: "Passaportes de ambos os pais", en: "Both parents' passports", es: "Pasaportes de ambos padres" }
  instructions:
    pt: "Originais ou cópia certificada da página de identificação."
    en: "Originals or certified copy of the identification page."
    es: "Originales o copia certificada de la página de identificación."

- id: PARENTAL_CONSENT
  name: { pt: "Autorização dos pais / representante legal", en: "Parental or guardian consent", es: "Autorización de los padres / tutor legal" }
  instructions:
    pt: "Com assinatura reconhecida, sempre que o menor não viaja com ambos os pais."
    en: "With a certified signature, whenever the minor doesn't travel with both parents."
    es: "Con firma legitimada, siempre que el menor no viaje con ambos padres."

- id: SOLE_CUSTODY_PROOF
  name: { pt: "Comprovativo de guarda exclusiva", en: "Proof of sole custody", es: "Prueba de custodia exclusiva" }
  instructions:
    pt: "Certidão de nascimento com um só progenitor, certidão de óbito do outro progenitor ou decisão judicial."
    en: "Birth certificate naming one parent, death certificate of the other parent, or court ruling."
    es: "Certificado de nacimiento con un solo progenitor, certificado de defunción del otro o resolución judicial."

- id: IEFP_DECLARATION
  name: { pt: "Declaração de manifestação de interesse no IEFP", en: "IEFP expression-of-interest declaration", es: "Declaración de interés en el IEFP" }
  instructions:
    pt: "Submetida online em iefp.pt (declaração para visto de procura de trabalho)."
    en: "Submitted online at iefp.pt (job seeker visa declaration)."
    es: "Presentada en línea en iefp.pt (declaración para visado de búsqueda de empleo)."

- id: STAY_CONDITIONS
  name: { pt: "Declaração das condições da estadia", en: "Declaration of the conditions of stay", es: "Declaración de las condiciones de la estancia" }

# ---- AIMA residence permits (autorizações de residência), from aima.gov.pt ----

- id: AIMA_FORM
  name: { pt: "Impresso de pedido de autorização de residência (AIMA)", en: "Residence permit application form (AIMA)", es: "Impreso de solicitud de autorización de residencia (AIMA)" }
  instructions:
    pt: "Impresso próprio da AIMA (Modelo 1), preenchido e assinado pelo requerente ou pelo representante legal."
    en: "AIMA's own form (Model 1), completed and signed by the applicant or their legal representative."
    es: "Impreso propio de la AIMA (Modelo 1), cumplimentado y firmado por el solicitante o su representante legal."

- id: PASSPORT_VALID
  name: { pt: "Passaporte válido", en: "Valid passport", es: "Pasaporte válido" }
  instructions:
    pt: "Cópia da página de identificação e da página do visto ou carimbo de entrada. Deve estar válido à data do pedido."
    en: "Copy of the identification page and of the page with the visa or entry stamp. It must be valid on the date of the application."
    es: "Copia de la página de identificación y de la página del visado o sello de entrada. Debe estar vigente en la fecha de la solicitud."

- id: PT_VISA
  name: { pt: "Visto válido com que entrou em Portugal", en: "Valid visa you entered Portugal with", es: "Visado válido con el que entró en Portugal" }
  instructions:
    pt: "O visto emitido para esta finalidade (de residência ou de procura de trabalho), ainda válido."
    en: "The visa issued for this purpose (residence or job seeker visa), still valid."
    es: "El visado emitido para esta finalidad (de residencia o de búsqueda de empleo), aún vigente."

- id: ADDRESS_DECLARATION
  name: { pt: "Declaração de morada (compromisso de honra)", en: "Address declaration (solemn declaration)", es: "Declaración de domicilio (bajo compromiso de honor)" }
  instructions:
    pt: "Indica a morada e a que título lá vive: proprietário, arrendatário, subarrendatário, usufrutuário, comodatário, etc."
    en: "States the address and on what basis you live there: owner, tenant, subtenant, usufructuary, borrower, etc."
    es: "Indica el domicilio y a qué título vive allí: propietario, arrendatario, subarrendatario, usufructuario, comodatario, etc."

- id: LAND_REGISTRY_CERT
  name: { pt: "Certidão de registo predial", en: "Land registry certificate", es: "Certificado del registro de la propiedad" }
  instructions:
    pt: "Se é proprietário ou usufrutuário: a certidão, ou o código de acesso à certidão permanente."
    en: "If you own the property or hold its usufruct: the certificate, or the access code to the online certificate."
    es: "Si es propietario o usufructuario: el certificado, o el código de acceso al certificado permanente."

- id: LANDLORD_DECLARATION
  name: { pt: "Declaração do senhorio ou da entidade alojadora", en: "Declaration from the landlord or host", es: "Declaración del arrendador o de la entidad que lo aloja" }
  instructions:
    pt: "Se é arrendatário ou vive em casa de outrem: indica a situação jurídica que lhe dá direito a usar o imóvel."
    en: "If you rent or live in someone else's home: states the legal basis of your right to use the property."
    es: "Si es arrendatario o vive en casa ajena: indica la situación jurídica que le da derecho a usar el inmueble."

- id: NIF_PROOF
  name: { pt: "Comprovativo do NIF (inscrição nas Finanças)", en: "Proof of tax number (NIF)", es: "Justificante del NIF (inscripción en Hacienda)" }

- id: NISS_PROOF
  name: { pt: "Comprovativo do NISS (inscrição na Segurança Social)", en: "Proof of social security number (NISS)", es: "Justificante del NISS (inscripción en la Seguridad Social)" }

- id: EMPLOYER_BOND_DECLARATION
  name: { pt: "Declaração do empregador sobre o vínculo laboral", en: "Employer's declaration of employment", es: "Declaración del empleador sobre la relación laboral" }
  instructions:
    pt: "Declaração sob compromisso de honra da entidade patronal, atestando o vínculo laboral."
    en: "Solemn declaration from the employer confirming the employment relationship."
    es: "Declaración bajo compromiso de honor del empleador, que acredita la relación laboral."

- id: REMOTE_BOND_DECLARATION
  name: { pt: "Declaração do empregador ou cliente no estrangeiro", en: "Declaration from your employer or client abroad", es: "Declaración del empleador o cliente en el extranjero" }
  instructions:
    pt: "Sob compromisso de honra, da pessoa ou empresa com domicílio ou sede fora de Portugal, atestando o vínculo laboral ou a prestação de serviços."
    en: "Solemn declaration from the person or company based outside Portugal, confirming the employment or the provision of services."
    es: "Bajo compromiso de honor, de la persona o empresa con domicilio o sede fuera de Portugal, que acredita la relación laboral o la prestación de servicios."

- id: LEGAL_ENTRY_PROOF
  name: { pt: "Comprovativo de entrada legal", en: "Proof of legal entry", es: "Justificante de entrada legal" }
  instructions:
    pt: "Visto válido à data da entrada em Portugal, ou 12 meses de contribuições para a Segurança Social."
    en: "A visa that was valid when you entered Portugal, or 12 months of social security contributions."
    es: "Visado vigente en la fecha de entrada en Portugal, o 12 meses de cotizaciones a la Seguridad Social."

- id: ACTIVITY_START_PROOF
  name: { pt: "Comprovativo de início de atividade", en: "Proof of registration as self-employed", es: "Justificante de inicio de actividad" }
  instructions:
    pt: "Início de atividade nas Finanças e na Segurança Social."
    en: "Registration of the activity with the tax authority and social security."
    es: "Alta de la actividad en Hacienda y en la Seguridad Social."

- id: RECENT_RECEIPTS
  name: { pt: "Últimos recibos emitidos", en: "Latest invoices issued", es: "Últimos recibos emitidos" }
  instructions:
    pt: "Recibos verdes ou faturas emitidos pela atividade independente."
    en: "Receipts or invoices issued for the self-employed work."
    es: "Recibos o facturas emitidos por la actividad por cuenta propia."

- id: QUALIFICATION_CERT
  name: { pt: "Certificado de habilitações ou de especialização", en: "Certificate of qualifications or specialisation", es: "Certificado de titulación o de especialización" }
  instructions:
    pt: "Cópia autenticada do diploma ou do documento que comprova a especialização ou a experiência profissional."
    en: "Certified copy of the diploma or of the document proving the specialisation or professional experience."
    es: "Copia compulsada del título o del documento que acredita la especialización o la experiencia profesional."

- id: HQ_EMPLOYER_DECLARATION
  name: { pt: "Declaração do empregador (contrato altamente qualificado)", en: "Employer's declaration (highly qualified contract)", es: "Declaración del empleador (contrato altamente cualificado)" }
  instructions:
    pt: "Atesta um contrato de trabalho com salário de pelo menos 1,5 vezes o salário médio nacional (1,2 vezes nas profissões com falta de trabalhadores), segundo os valores em vigor."
    en: "Confirms an employment contract with a salary of at least 1.5 times the national average salary (1.2 times in shortage occupations), at the current figures."
    es: "Acredita un contrato de trabajo con un salario de al menos 1,5 veces el salario medio nacional (1,2 veces en profesiones con escasez de trabajadores), según los valores vigentes."

- id: HOST_RESPONSIBILITY_TERM
  name: { pt: "Termo de responsabilidade da entidade de acolhimento", en: "Statement of responsibility from the host entity", es: "Declaración de responsabilidad de la entidad de acogida" }
  instructions:
    pt: "Emitido pela entidade que utiliza a atividade do requerente."
    en: "Issued by the entity that uses the applicant's work."
    es: "Emitida por la entidad que utiliza la actividad del solicitante."

- id: TECH_VISA_TERM
  name: { pt: "Termo de responsabilidade da empresa certificada (Tech Visa)", en: "Statement of responsibility from the certified company (Tech Visa)", es: "Declaración de responsabilidad de la empresa certificada (Tech Visa)" }
  instructions:
    pt: "Emitido pela empresa certificada pelo IAPMEI que recruta o requerente."
    en: "Issued by the IAPMEI-certified company recruiting the applicant."
    es: "Emitida por la empresa certificada por el IAPMEI que contrata al solicitante."

- id: CRIMINAL_RECORD_CONSENT
  name: { pt: "Autorização de consulta do registo criminal português", en: "Consent to check the Portuguese criminal record", es: "Autorización de consulta del registro penal portugués" }
  instructions:
    pt: "Autoriza a AIMA a consultar o registo criminal português (não se aplica a menores de 16 anos)."
    en: "Allows AIMA to check the Portuguese criminal record (not for children under 16)."
    es: "Autoriza a la AIMA a consultar el registro penal portugués (no se aplica a menores de 16 años)."

- id: SUBSISTENCE_PROOF
  name: { pt: "Comprovativo de meios de subsistência", en: "Proof of means of subsistence", es: "Justificante de medios de subsistencia" }

- id: DIPLOMATIC_ACCREDITATION
  name: { pt: "Comprovativo de acreditação diplomática em Portugal", en: "Proof of diplomatic accreditation in Portugal", es: "Justificante de acreditación diplomática en Portugal" }
  instructions:
    pt: "Acreditação durante pelo menos 3 anos."
    en: "Accreditation for at least 3 years."
    es: "Acreditación durante al menos 3 años."

- id: DEPENDENCY_PROOF
